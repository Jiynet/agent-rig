# golangci-lint v2 配置
version: "2"

linters:
  # standard 集合包含 errcheck、govet、ineffassign、staticcheck、unused 等默认项
  default: standard
  enable:
    - revive   # 更严格的 go doc / 命名规范检查
  exclusions:
    generated: lax
    rules:
      # 测试代码允许忽略错误返回与文档注释，生产代码仍然严格检查。
      - path: _test\.go
        linters:
          - errcheck
          - revive

formatters:
  enable:
    - gofmt
    - goimports
