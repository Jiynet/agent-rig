# AgentRig 示例配置。
# 复制为 configs/config.local.yaml 后按需修改；该文件已被 .gitignore 忽略，
# 切勿提交任何含密钥的配置。
llm:
  provider: openai # openai 兼容接口（OpenAI / DeepSeek / vLLM / Ollama 等）
  model: gpt-4o
  base_url: https://api.openai.com/v1
  api_key_env: OPENAI_API_KEY # 从环境变量读取密钥，不要硬编码
  temperature: 0.2
  max_tokens: 2048

agent:
  # ReAct 循环最大迭代次数，防止死循环
  max_iterations: 10

context:
  # 提示词 token 预算（估算值）；-1 关闭上下文组装，全量历史透传。
  max_prompt_tokens: 6000
  # 至少保留原文的最近消息条数。
  recent_messages: 8
  # 单条工具观察的最大 token，超出按头尾截断。
  max_tool_output_tokens: 400
  # 旧轮次摘要的最大 token。
  summary_max_tokens: 300

tools:
  enabled:
    - shell
    - file_read
    - file_write
    - web_search
    - http_request

memory:
  enabled: true

logging:
  level: info # debug | info | warn | error
